server:
  port: 8081

spring:
  application:
    name: ms-campuslab-catalog

  datasource:
    # Formato Oracle thin: jdbc:oracle:thin:@//HOST:PORT/SERVICE_NAME
    url: jdbc:oracle:thin:@//${DB_HOST:oracle-db-host}:${DB_PORT:1521}/${DB_SERVICE:CAMPUSLABPDB}
    username: ${DB_USERNAME:campuslab_catalog}
    password: ${DB_PASSWORD:changeit}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: ms-campuslab-catalog-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      # 'validate' es lo recomendado en ambientes reales: el esquema se gestiona
      # con scripts DDL o una herramienta de migración (Flyway/Liquibase).
      # Usar 'update' solo en desarrollo local si aún no existe el esquema.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Broker externo de notificaciones (ver spring-boot-starter-amqp en el pom.xml).
  rabbitmq:
    host: ${RABBITMQ_HOST:54.234.173.1}
    port: ${RABBITMQ_PORT:5672}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # El healthcheck de Docker depende de /actuator/health devolviendo 200;
    # el indicador automatico de RabbitMQ prueba conectividad real contra el
    # broker (externo, fuera de esta red) y lo tumbaria a DOWN si ese broker
    # no esta disponible en este momento, aunque la app en si funcione bien.
    rabbit:
      enabled: false

logging:
  level:
    root: INFO
    com.campuslab.catalog: DEBUG
    org.hibernate.SQL: WARN
